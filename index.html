<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <title>Formulario de Salas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root{
            --bg:#f6f7fb;
            --card:#ffffff;
            --pri:#4f46e5;
            --pri-700:#4338ca;
            --text:#1f2937;
            --muted:#6b7280;
            --border:#e5e7eb;
            --danger:#ef4444;
        }
        *{box-sizing:border-box}
        body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
        .wrap{max-width:1080px;margin:32px auto;padding:0 16px}
        .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
        h1{margin:0;font-size:24px;font-weight:700}
        button,.btn{padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;border:0;transition:.2s}
        .btn-primary{background:var(--pri);color:#fff}
        .btn-primary:hover{background:var(--pri-700)}
        .btn-outline{background:#fff;border:1px solid var(--border)}
        .btn-danger{background:var(--danger);color:#fff;font-size:13px}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
        .card{background:white;border:1px solid var(--border);border-radius:14px;padding:20px;box-shadow:0 10px 20px rgba(0,0,0,0.06)}
        .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
        .badge{padding:6px 12px;border-radius:999px;background:#f3f4f6;color:var(--muted);font-weight:700;font-size:13px}
        .field{margin:16px 0}
        .label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px;display:block}
        input[type="text"],select,textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;font-size:15px}
        textarea{min-height:90px;resize:vertical}
        .checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
        .hidden{display:none}
        .empty{text-align:center;padding:80px 20px;border:2px dashed var(--border);border-radius:16px;color:var(--muted);margin-top:40px}
        .fab{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--pri);color:white;border-radius:50px;padding:16px 22px;font-weight:700;box-shadow:0 10px 20px rgba(0,0,0,.2);z-index:10}
        .footer{position:sticky;bottom:0;background:rgba(246,247,251,0.95);border-top:1px solid var(--border);padding:16px;margin-top:32px;display:flex;justify-content:flex-end}
        .table{width:100%;border-collapse:collapse;margin-top:20px}
        .table th,.table td{border:1px solid var(--border);padding:8px;text-align:left}
        .img-evidencia{max-width:100px;max-height:60px;cursor:pointer;}
    </style>
</head>
<body>

<div class="wrap" id="formView">
    <div class="head">
        <h1>Gestión de Salas</h1>
        <button class="btn btn-outline" id="viewRecordsBtn">Ver registros</button>
    </div>
    <div id="roomsContainer" class="grid"></div>
    <div id="emptyState" class="empty">
        <h2>Aún no hay salas</h2>
        <button class="btn btn-primary" id="addFirstRoomBtn">Agregar sala</button>
    </div>
    <div class="footer hidden" id="footerActions">
        <button class="btn btn-primary" id="createBtn">Guardar y generar Excel</button>
    </div>
</div>

<button class="fab hidden" id="floatingAddBtn">+ Agregar sala</button>

<div class="wrap hidden" id="recordsView">
    <div class="head">
        <h1>Consulta de Registros</h1>
        <button class="btn btn-outline" id="backBtn">Volver</button>
    </div>
    <select id="filterUsuario"></select>
    <select id="filterFecha">
        <option value="todas">Todas las fechas</option>
        <option value="hoy">Hoy</option>
        <option value="semana">Esta semana</option>
        <option value="mes">Este mes</option>
    </select>
    <button class="btn btn-primary" id="buscarBtn">Buscar</button>

    <table class="table">
        <thead>
            <tr>
                <th>Sala</th>
                <th>Usuario</th>
                <th>Estado Sala</th>
                <th>Estado TV</th>
                <th>HDMI</th>
                <th>Cámara</th>
                <th>Control</th>
                <th>Micrófonos</th>
                <th>Serial Cámara</th>
                <th>Detalles</th>
                <th>Fecha</th>
                <th>Evidencia</th>
            </tr>
        </thead>
        <tbody id="tablaResultados"></tbody>
    </table>
</div>

<template id="roomTemplate">
    <div class="card room">
        <div class="card-head">
            <span class="badge">Sala</span>
            <button class="btn btn-danger" onclick="removeRoom(this.closest('.room'))">Eliminar</button>
        </div>
        <div class="field">
            <label class="label">Nombre de la sala</label>
            <input type="text" class="room-name"/>
        </div>
        <div class="field">
            <label class="label">Usuario creador</label>
            <select class="usuario-creador"><option value="">Seleccione un usuario</option></select>
        </div>
        <div class="field">
            <label class="label">Serial de cámara</label>
            <input type="text" class="serial-camara"/>
        </div>
        <div class="field">
            <label class="label">Elementos disponibles</label>
            <div class="checks">
                <div>
                    <label>Televisor</label>
                    <select class="el-televisor">
                        <option value="no selecciono">Eliga una opción</option>
                        <option value="Funciona">Funciona</option>
                        <option value="No funciona">No funciona</option>
                        <option value="No tiene">No tiene</option>
                    </select>
                </div>
                <div>
                    <label>Cable HDMI</label>
                    <select class="el-hdmi">
                        <option value="no selecciono">Eliga una opción</option>
                        <option value="Funciona">Funciona</option>
                        <option value="No funciona">No funciona</option>
                        <option value="No tiene">No tiene</option>
                    </select>
                </div>
                <div>
                    <label>Cámara</label>
                    <select class="el-camara">
                        <option value="no selecciono">Eliga una opción</option>
                        <option value="Funciona">Funciona</option>
                        <option value="No funciona">No funciona</option>
                        <option value="No tiene">No tiene</option>
                    </select>
                </div>
                <div>
                    <label>Control</label>
                    <select class="el-control">
                        <option value="no selecciono">Eliga una opción</option>
                        <option value="Funciona">Funciona</option>
                        <option value="No funciona">No funciona</option>
                        <option value="No tiene">No tiene</option>
                    </select>
                </div>
                <div>
                    <label>¿Tiene micrófonos externos?</label>
                    <input type="checkbox" class="el-microfonos">
                </div>
            </div>
        </div>
        <div class="field">
            <label class="label">Estado actual de la sala</label>
            <select class="estado">
                <option value="no selecciono">Eliga una opción</option>
                <option value="Operativa">Operativa</option>
                <option value="Incompleta">Incompleta</option>
                <option value="Inoperativa">Inoperativa</option>
            </select>
        </div>
        <div class="field">
            <label class="label">Detalles</label>
            <textarea class="detalles"></textarea>
        </div>
        <div>
            <input type="file" class="evidencia_img">
        </div>
    </div>
</template>

<script>
    const ApiURL = "https://rpeencgsnhjjmohuvwgj.supabase.co";
    const publicKeySupabase = "sb_publishable_KcW3KAlFV4fUpYNJswVKoA_jqsmr_Co";
    const conexion = supabase.createClient(ApiURL, publicKeySupabase);

    const roomsContainer = document.getElementById("roomsContainer");
    const emptyState = document.getElementById("emptyState");
    const footer = document.getElementById("footerActions");
    const floatingBtn = document.getElementById("floatingAddBtn");
    const tmpl = document.getElementById("roomTemplate");
    const tablaResultados = document.getElementById("tablaResultados");
    const filterUsuario = document.getElementById("filterUsuario");
    const filterFecha = document.getElementById("filterFecha");

    let usuarios = [];

    async function loadUsuarios(){
        const { data } = await conexion.from("usuarios").select("id,nombre");
        usuarios = data || [];
        filterUsuario.innerHTML = '<option value="todos">Todos los usuarios</option>';
        usuarios.forEach(u => {
            const opt = document.createElement("option");
            opt.value = u.id;
            opt.textContent = u.nombre;
            filterUsuario.appendChild(opt);
        });
    }

    function updateUI(){
        const hasRooms = document.querySelectorAll(".room").length > 0;
        emptyState.classList.toggle("hidden", hasRooms);
        footer.classList.toggle("hidden", !hasRooms);
        floatingBtn.classList.toggle("hidden", !hasRooms);
    }

    function scrollToLast(){
        const last = document.querySelector(".room:last-child");
        if(last) setTimeout(() => last.scrollIntoView({behavior:"smooth", block:"center"}), 100);
    }

    function addRoom(){
        const clone = document.importNode(tmpl.content,true);
        roomsContainer.appendChild(clone);
        fillUsuarios();
        updateUI();
        scrollToLast();
    }

    function removeRoom(card){
        card.remove();
        updateUI();
    }

    function fillUsuarios(){
        document.querySelectorAll(".usuario-creador").forEach(select=>{
            if(select.options.length>1) return;
            usuarios.forEach(u=>{
                const opt = document.createElement("option");
                opt.value = u.id;
                opt.textContent = u.nombre;
                select.appendChild(opt);
            });
        });
    }

    async function exportExcel(){
        const rooms = [...document.querySelectorAll('.room')];
        if(!rooms.length) return;

        const data = [];
        for(const card of rooms){
            const fileInput = card.querySelector('.evidencia_img');
            const file = fileInput.files[0];
            let uniqueImageName = null;

            if(file){
                const ext = file.name.split('.').pop();
                const now = new Date();
                const timestamp = now.getFullYear().toString()+
                                  (now.getMonth()+1).toString().padStart(2,'0')+
                                  now.getDate().toString().padStart(2,'0')+"_"+
                                  now.getHours().toString().padStart(2,'0')+
                                  now.getMinutes().toString().padStart(2,'0')+
                                  now.getSeconds().toString().padStart(2,'0');
                const random = Math.floor(Math.random()*100000);
                uniqueImageName = `sala_${timestamp}_${random}.${ext}`;
                await conexion.storage.from('Imagenes_Evidencia').upload(uniqueImageName, file);
            }

            data.push({
                nombre_sala: card.querySelector('.room-name').value.trim() || null,
                usuario_creador: parseInt(card.querySelector('.usuario-creador').value) || null,
                serial_camara: card.querySelector('.serial-camara').value.trim() || null,
                estado_tv: card.querySelector('.el-televisor').value || null,
                estado_hdmi: card.querySelector('.el-hdmi').value || null,
                estado_camara: card.querySelector('.el-camara').value || null,
                estado_control: card.querySelector('.el-control').value || null,
                microfonos_externos: card.querySelector('.el-microfonos').checked ? 'Si tiene' : 'No tiene',
                estado_sala: card.querySelector('.estado').value || null,
                detalles_extra: card.querySelector('.detalles').value.trim() || null,
                fecha_revision: new Date().toISOString().split('T')[0],
                evidencia_img: uniqueImageName
            });
        }

        const { error } = await conexion.from('revision_salas').insert(data);
        if(error){
            console.error("Error insertando en la DB:", error);
            alert("No se pudo guardar en la base de datos");
            return;
        }

        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.json_to_sheet(data);
        XLSX.utils.book_append_sheet(wb, ws, 'Salas');
        const wbout = XLSX.write(wb, { bookType:'xlsx', type:'array' });
        const blob = new Blob([wbout], { type:'application/octet-stream' });

        const fileHandle = await window.showSaveFilePicker({
            suggestedName:`Inventario_Salas_${Date.now()}.xlsx`,
            types:[{ description:'Excel File', accept:{'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':['.xlsx']}}]
        });
        const writable = await fileHandle.createWritable();
        await writable.write(blob);
        await writable.close();

        roomsContainer.innerHTML="";
        updateUI();
    }

    async function buscarRegistros(){
        let query = conexion.from('revision_salas').select('*');
        const usuario = filterUsuario.value;
        const fecha = filterFecha.value;

        if(usuario !== 'todos') query = query.eq('usuario_creador', usuario);
        const now = new Date();
        if(fecha==='hoy') query=query.gte('fecha_revision', new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString());
        else if(fecha==='semana'){
            const firstDayOfWeek = new Date(now.setDate(now.getDate() - now.getDay()));
            query = query.gte('fecha_revision', firstDayOfWeek.toISOString());
        }
        else if(fecha==='mes'){
            const firstDayOfMonth = new Date(now.getFullYear(), now.getMonth(),1);
            query = query.gte('fecha_revision', firstDayOfMonth.toISOString());
        }

        const { data } = await query;
        tablaResultados.innerHTML = '';
        for(const r of data){
            let urlImg = '';
            if(r.evidencia_img) urlImg = conexion.storage.from('Imagenes_Evidencia').getPublicUrl(r.evidencia_img).data.publicUrl;
            const usuarioNombre = usuarios.find(u=>u.id===r.usuario_creador)?.nombre || 'Desconocido';
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${r.nombre_sala}</td>
                            <td>${usuarioNombre}</td>
                            <td>${r.estado_sala}</td>
                            <td>${r.estado_tv}</td>
                            <td>${r.estado_hdmi}</td>
                            <td>${r.estado_camara}</td>
                            <td>${r.estado_control}</td>
                            <td>${r.microfonos_externos}</td>
                            <td>${r.serial_camara}</td>
                            <td>${r.detalles_extra}</td>
                            <td>${new Date(r.fecha_revision).toLocaleString()}</td>
                            <td>${urlImg?'<img class="img-evidencia" src="'+urlImg+'" onclick="window.open(\''+urlImg+'\', \'_blank\')" />':''}</td>`;
            tablaResultados.appendChild(tr);
        }
    }

    document.getElementById("addFirstRoomBtn").onclick = addRoom;
    floatingBtn.onclick = addRoom;
    document.getElementById("createBtn").onclick = exportExcel;
    document.getElementById("viewRecordsBtn").onclick = () => {
        document.getElementById("formView").classList.add("hidden");
        document.getElementById("recordsView").classList.remove("hidden");
    };
    document.getElementById("backBtn").onclick = () => {
        document.getElementById("recordsView").classList.add("hidden");
        document.getElementById("formView").classList.remove("hidden");
    };
    document.getElementById("buscarBtn").onclick = buscarRegistros;

    loadUsuarios();
    updateUI();
</script>

</body>
</html>
